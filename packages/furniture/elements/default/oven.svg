<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- Body -->
  <rect x="0" y="0" width="600" height="600" fill="#e8e8e8" stroke="black" stroke-width="8"/>
  <!-- Oven door -->
  <rect x="40" y="100" width="520" height="460" fill="#d8d8d8" stroke="black" stroke-width="5"/>
  <!-- Door window -->
  <rect x="120" y="160" width="360" height="200" rx="10" fill="#f0f0f0" stroke="black" stroke-width="4"/>
  <!-- Handle -->
  <line x1="160" y1="60" x2="440" y2="60" stroke="black" stroke-width="6"/>
</svg>
