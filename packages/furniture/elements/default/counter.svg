<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 600">
  <!-- Counter body -->
  <rect x="0" y="0" width="3000" height="600" fill="#e8e8e8" stroke="black" stroke-width="8"/>
  <!-- Sink basin -->
  <rect x="1200" y="100" width="600" height="400" rx="30" fill="#d8d8d8" stroke="black" stroke-width="5"/>
  <!-- Faucet -->
  <circle cx="1500" cy="150" r="25" fill="#a0a0a0" stroke="black" stroke-width="3"/>
  <!-- Cabinet dividers -->
  <line x1="750" y1="20" x2="750" y2="580" stroke="black" stroke-width="3"/>
  <line x1="2250" y1="20" x2="2250" y2="580" stroke="black" stroke-width="3"/>
</svg>
