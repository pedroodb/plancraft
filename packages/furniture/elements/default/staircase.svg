<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 2500">
  <!-- Outline -->
  <rect x="0" y="0" width="900" height="2500" fill="#e8e8e8" stroke="black" stroke-width="8"/>
  <!-- Steps (10 treads) -->
  <line x1="0" y1="250" x2="900" y2="250" stroke="black" stroke-width="4"/>
  <line x1="0" y1="500" x2="900" y2="500" stroke="black" stroke-width="4"/>
  <line x1="0" y1="750" x2="900" y2="750" stroke="black" stroke-width="4"/>
  <line x1="0" y1="1000" x2="900" y2="1000" stroke="black" stroke-width="4"/>
  <line x1="0" y1="1250" x2="900" y2="1250" stroke="black" stroke-width="4"/>
  <line x1="0" y1="1500" x2="900" y2="1500" stroke="black" stroke-width="4"/>
  <line x1="0" y1="1750" x2="900" y2="1750" stroke="black" stroke-width="4"/>
  <line x1="0" y1="2000" x2="900" y2="2000" stroke="black" stroke-width="4"/>
  <line x1="0" y1="2250" x2="900" y2="2250" stroke="black" stroke-width="4"/>
  <!-- Direction arrow -->
  <line x1="450" y1="2300" x2="450" y2="200" stroke="black" stroke-width="5"/>
  <polygon points="450,150 400,300 500,300" fill="black"/>
</svg>
