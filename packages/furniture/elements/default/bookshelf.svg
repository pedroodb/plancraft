  <!-- Shelf dividers (horizontal) -->
  <line x1="0" y1="88" x2="800" y2="88" stroke="black" stroke-width="4"/>
  <line x1="0" y1="175" x2="800" y2="175" stroke="black" stroke-width="4"/>
  <line x1="0" y1="263" x2="800" y2="263" stroke="black" stroke-width="4"/>
